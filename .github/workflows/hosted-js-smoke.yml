name: Hosted JavaScript Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  hosted-js-smoke:
    runs-on: ubuntu-latest
    name: Verify published JavaScript behavior
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install browser test dependencies
        run: |
          npm ci
          node --input-type=module -e "import('playwright').then(() => console.log('Playwright dependency resolved from node_modules.'))"
          npx playwright install --with-deps chromium

      - name: Run smoke test against published site
        env:
          BASE_URL: https://askjamie.bot
        run: |
          mkdir -p artifacts/hosted-js-smoke
          set +e
          node tests/test_js_smoke.spec.mjs 2>&1 | tee artifacts/hosted-js-smoke/smoke-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "# Hosted JavaScript Smoke Summary"
            echo
            echo "- Checked (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- Published origin: ${BASE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            if [ "$status" -eq 0 ]; then
              echo "- Result: PASS"
            else
              echo "- Result: FAIL (exit ${status})"
            fi
            echo
            echo "## Smoke output"
            echo
            echo '```text'
            cat artifacts/hosted-js-smoke/smoke-output.txt
            echo '```'
          } > artifacts/hosted-js-smoke/summary.md
          cat artifacts/hosted-js-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Retain smoke summary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-js-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/hosted-js-smoke/
          if-no-files-found: error
          retention-days: 90
