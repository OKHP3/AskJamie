name: Site Validation
# Both validate-site.py and audit-site.py must pass for the build to succeed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate site HTML, links, and structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 "pytest>=8"

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Run link checker
        run: python3 scripts/check-links.py

      - name: Run regression tests
        run: python3 -m pytest

      - name: Rebuild search index
        run: python3 scripts/build-search-index.py
        continue-on-error: false

      - name: Verify search index was built
        run: |
          if [ ! -f assets/data/search-index.json ]; then
            echo "ERROR: search-index.json not found after build step"
            exit 1
          fi
          echo "Search index OK: $(wc -c < assets/data/search-index.json) bytes"

      - name: Run site auditor
        # Checks search-index consistency (template contamination, missing pages),
        # sitemap reconciliation, image hygiene, and governance checks.
        # Exits 1 if any issues are found.
        run: python3 scripts/audit-site.py --quiet

  deploy:
    name: Deploy validated site to GitHub Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
