name: Public GPT Availability

on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * *'

permissions:
  contents: read

jobs:
  public-gpt-links:
    runs-on: ubuntu-latest
    name: Check represented public GPT destinations
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe public GPT destinations
        id: probe
        run: |
          mkdir -p artifacts/public-gpt-links
          set +e
          python3 scripts/check-public-gpt-links.py --timeout 15 --retries 2 2>&1 | tee artifacts/public-gpt-links/results.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"

          {
            echo "# Public GPT Availability"
            echo
            echo "- Checked (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "## Results"
            echo
            echo '```text'
            cat artifacts/public-gpt-links/results.txt
            echo '```'
            echo
            echo "## Interpretation"
            echo
            echo '- `reachable`: destination returned HTTP 2xx or 3xx.'
            echo '- `broken_or_unpublished`: investigate the affected lens and URL immediately.'
            echo '- `authentication_or_private`: investigate publication/privacy settings for the affected lens.'
            echo '- `transient_network` or `transient_service`: retry separately; do not label the GPT broken.'
          } | tee artifacts/public-gpt-links/summary.md >> "$GITHUB_STEP_SUMMARY"

          if grep -Eq 'broken_or_unpublished|authentication_or_private|unexpected_response' artifacts/public-gpt-links/results.txt; then
            echo "::error::A represented public GPT destination returned an actionable status; see the lens ID and URL above."
            exit 1
          fi
          if grep -Eq 'transient_network|transient_service' artifacts/public-gpt-links/results.txt; then
            echo "::warning::Only transient GPT probe results remain after bounded retries; investigate separately."
            exit 0
          fi
          exit "$status"

      - name: Preserve classified probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-gpt-links-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/public-gpt-links/
          if-no-files-found: error
          retention-days: 30
