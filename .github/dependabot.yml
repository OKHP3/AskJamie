version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      npm-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    # Major updates remain separate, reviewable PRs. No auto-merge workflow.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      python-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
