  tokens:
    color:
      foundation:
        background: "#f6f2ee"
        surface: "#fdfbf7"
        foreground: "#2e2b29"
        muted: "#6b6460"
        accent: "#2d6f7e"
        footer_surface: "#f7f3ee"
      semantic:
        accent: "#2d6f7e"
        dark_mode_meta_teal: "#2c5e6f"
        border_subtle: "rgba(0, 0, 0, 0.08)"
    typography:
      roles:
        heading: { family: "Baloo 2", fallback: [system-ui, sans-serif], notes: "Rounded, warm; use for page and section headings." }
        body: { family: "Open Sans", fallback: [system-ui, sans-serif], notes: "Legible and neutral; use for all running text." }
        accent: { family: "Kalam", fallback: [cursive, sans-serif], notes: "Handwritten feel; reserve for small personal notes." }
        mono: { family: "JetBrains Mono", fallback: [ui-monospace, monospace], notes: "Technical clarity for code and structured output." }
  direction:
    visual_narrative: Vintage technical helpdesk clarity with calm, human pacing.
    components: [quiet paper-grain surfaces, considered dividers, stepped walkthroughs, modest teal cues]
    imagery: [mid-century office technology, diagrams, desktop objects, paper texture]
    motion: [restrained, explanatory, and never urgent]
    avoid: [alarmist alerts, visual noise, overly glossy AI imagery, pressure-heavy calls to action]
  application:
    suitable_targets: [spa, documentation, presentation, image-brief]
    accessibility_notes:
      - Check contrast of muted text (#6b6460) on background (#f6f2ee) for non-essential uses only.
      - Accent blue-teal (#2d6f7e) on white surfaces passes WCAG AA at normal text sizes.
    target_constraints:
      - Preserve existing page structure and brand class conventions (body.askjamie-main).
      - Verify Google Fonts availability and declare system-font fallbacks.
    acceptance_checks:
      - Token layer reviewed
      - Representative viewports inspected
      - Keyboard focus checked
      - Contrast checked for each meaningful state
  conflicts: [none recorded]
  confidence: { overall: high, notes: "Promoted from seed; tokens confirmed against declared theme.css values." }
